<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL | AUTH</title>
    <style>
        :root {
            --accent: #1a73e8;
            --bg: #050505;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        
        body { 
            background: var(--bg); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
        }

        /* Subtle Background Glow */
        .glow {
            position: absolute;
            width: 200px;
            height: 200px;
            background: var(--accent);
            filter: blur(120px);
            opacity: 0.2;
            z-index: 1;
        }

        .auth-card {
            position: relative;
            z-index: 10;
            width: 85%;
            max-width: 350px;
            text-align: center;
            padding: 40px 20px;
        }

        .shield-icon {
            font-size: 32px;
            color: var(--accent);
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        h1 {
            color: #fff;
            font-size: 12px;
            letter-spacing: 6px;
            font-weight: 900;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .pin-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            color: #fff;
            font-size: 28px;
            letter-spacing: 15px;
            text-align: center;
            width: 100%;
            padding: 20px;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 20px rgba(26, 115, 232, 0.2);
        }

        #status-text {
            font-size: 9px;
            color: #444;
            letter-spacing: 2px;
            font-weight: 800;
            text-transform: uppercase;
            margin-top: 20px;
            height: 12px;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.5; transform: scale(0.95); }
        }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body>

<div class="glow"></div>

<div class="auth-card" id="card">
    <div class="shield-icon">⚡</div>
    <h1>System Access</h1>
    
    <div class="pin-wrapper">
        <input type="password" id="pinField" maxlength="4" placeholder="••••" autofocus autocomplete="off">
    </div>
    
    <div id="status-text">Encrypted Connection Active</div>
</div>

<script>
    const pinField = document.getElementById('pinField');
    const statusText = document.getElementById('status-text');
    const card = document.getElementById('card');
    
    // Master Pin from request
    const MASTER_PIN = "9002";

    pinField.addEventListener('input', (e) => {
        const val = e.target.value;

        if (val === MASTER_PIN) {
            statusText.innerText = "Access Granted";
            statusText.style.color = "#34a853";
            pinField.style.borderColor = "#34a853";
            
            // Redirect to Admin Panel
            setTimeout(() => {
                window.location.href = 'ADMIN.html';
            }, 600);
        } 
        else if (val.length >= 4) {
            // Error Handling
            card.classList.add('shake');
            statusText.innerText = "Verification Failed";
            statusText.style.color = "#ea4335";
            pinField.style.borderColor = "#ea4335";
            
            setTimeout(() => {
                card.classList.remove('shake');
                pinField.value = "";
                statusText.innerText = "Encrypted Connection Active";
                statusText.style.color = "#444";
                pinField.style.borderColor = "rgba(255, 255, 255, 0.08)";
            }, 1000);
        }
    });
</script>

</body>
</html>
